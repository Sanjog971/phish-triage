[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phish-triage"
version = "1.0.0"
description = "Static, safety-first triage of sanitized phishing email samples with approved-source reputation checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
psl = ["tldextract>=5"]
test = ["pytest>=8", "markdown-it-py[linkify]>=3"]  # renderer checks skip if absent

[project.scripts]
phish-triage = "phish_triage.cli:main"

[tool.setuptools.packages.find]
include = ["phish_triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
